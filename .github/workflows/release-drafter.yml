# Draft (or update) the next GitHub release on every push to main.
# Uses KoblerS/release-drafter; config lives in .github/release-drafter.yml.
name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write        # create/update the draft release
      pull-requests: write   # autolabeler writes PR labels
    runs-on: ubuntu-latest
    steps:
      - uses: KoblerS/release-drafter@master
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
